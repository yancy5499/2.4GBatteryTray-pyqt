name: Windows CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Prepare virtual environment
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe -m pip check
      - name: Compile sources
        run: .\.venv\Scripts\python.exe -m compileall -q src tools tests
      - name: Regression tests
        run: .\.venv\Scripts\python.exe -m unittest discover -s tests -v
      - name: Build executable and source archives
        shell: cmd
        run: build.bat all
      - name: Verify archives and packaged executable
        run: .\.venv\Scripts\python.exe tools\verify_release.py
      - name: Upload packages
        uses: actions/upload-artifact@v6
        with:
          name: 2.4GBatteryTray-win64-and-source
          path: |
            release/2.4GBatteryTray-win64.zip
            release/2.4GBatteryTray-source.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
